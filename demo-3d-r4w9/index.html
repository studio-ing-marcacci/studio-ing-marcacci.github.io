<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pianta 3D navigabile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: scena 3D a tutto schermo, barra comandi in basso pensata per il pollice */
:root{
  --bg:#f4eee3; --ink:#3a322a; --muted:#7d7266; --panel:rgba(255,252,246,.92);
  --line:#ddd3c3; --accent:#1f5f8f; --accent-ink:#ffffff; --label:#2b2b2b; --label-bg:rgba(255,255,255,.88);
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#242425; --ink:#ece8e0; --muted:#aaa59e; --panel:rgba(44,43,42,.92);
  --line:#45423e; --accent:#4f93c6; --accent-ink:#141414; --label:#f1ece4; --label-bg:rgba(36,36,37,.82); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#242425; --ink:#ece8e0; --muted:#aaa59e; --panel:rgba(44,43,42,.92);
  --line:#45423e; --accent:#4f93c6; --accent-ink:#141414; --label:#f1ece4; --label-bg:rgba(36,36,37,.82); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#app{position:relative;height:100%;display:flex;flex-direction:column}
header{padding-block:12px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
header p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.hint{font-size:11.5px;color:var(--muted)}
#stage{position:relative;flex:1;min-height:0}
#stage canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lab{font:500 12px/1 var(--f-ui);color:var(--label);background:var(--label-bg);padding:4px 7px;border-radius:4px;white-space:nowrap}
.lab.minor{font-size:10.5px;padding:3px 6px}
.bar{padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;border-top:1px solid var(--line);background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--bg)}
.seg button,.chip{font:500 13px/1 var(--f-ui);color:var(--ink);background:transparent;border:0;border-radius:999px;padding:9px 13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{border:1px solid var(--line);background:var(--bg)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{width:100%;text-align:center;font-size:11px;color:var(--muted);margin-top:2px}
#load{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--muted)}
#load[hidden]{display:none}
@media (max-width:520px){header{padding-block:10px 4px}.hint{display:none}.seg button,.chip{padding:9px 11px;font-size:12.5px}}
</style>

</head>
<body>
<div id="app">
  <header>
    <div><h1>Pianta 3D navigabile</h1><p>Esempio dimostrativo</p></div>
    <div class="hint">Trascina per ruotare · rotellina o due dita per lo zoom · tasto destro o due dita per spostare</div>
  </header>
  <div id="stage"><div id="labels"></div><div id="load">Caricamento del modello…</div></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Piano" id="floorseg"></div>
    <div class="seg" role="group" aria-label="Vista">
      <button id="v-3d" aria-pressed="true">3D</button>
      <button id="v-top" aria-pressed="false">Dall'alto</button>
    </div>
    <button class="chip" id="t-lab" aria-pressed="true">Nomi vani</button>
    <div class="note">Vista 3D indicativa – arredo e finiture indicativi</div>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const CFG = {"floors": [{"key": "pt", "name": "Piano terra", "dx": 0, "dz": 0, "model": "pt.glb", "labels": "pt_labels.json"}, {"key": "p1", "name": "Piano primo", "dx": 0, "dz": 0, "model": "p1.glb", "labels": "p1_labels.json"}]};
const STOREY = 3.2, EXPLODE = 3.6;
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const labelR = new CSS2DRenderer({ element: document.getElementById("labels") });
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 3; controls.maxDistance = 45; controls.screenSpacePanning = true;
scene.add(new THREE.HemisphereLight(0xfff8ee, 0xb9ab98, 1.35));
const sun = new THREE.DirectionalLight(0xfff1df, 2.4);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.245; ground.receiveShadow = true; scene.add(ground);

const multi = CFG.floors.length > 1;
let mode = multi ? CFG.floors[0].key : "all", view = "3d", showLabels = true;
const groups = {}, labels = {}; let center = new THREE.Vector3(), size = 10;

const seg = document.getElementById("floorseg");
if (multi) {
  for (const f of CFG.floors) seg.insertAdjacentHTML("beforeend", `<button data-m="${f.key}">${f.name}</button>`);
  seg.insertAdjacentHTML("beforeend", `<button data-m="all">Tutti i piani</button>`);
  seg.onclick = e => { const b = e.target.closest("button"); if (b) { mode = b.dataset.m; apply(); } };
} else seg.hidden = true;

function idx(k) { return CFG.floors.findIndex(f => f.key === k); }
function baseY(k) { const i = idx(k); return mode === "all" ? i * (STOREY + EXPLODE) : 0; }
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); labelR.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }
window.addEventListener("resize", () => { resize(); frame(false); });

function apply() {
  for (const f of CFG.floors) {
    const on = mode === "all" || mode === f.key;
    groups[f.key].visible = on; groups[f.key].position.y = baseY(f.key);
    for (const l of labels[f.key]) { l.visible = on && showLabels; l.position.y = baseY(f.key) + 1.45; }
  }
  frame(true);
  seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === mode));
  document.getElementById("v-3d").setAttribute("aria-pressed", view === "3d");
  document.getElementById("v-top").setAttribute("aria-pressed", view === "top");
  document.getElementById("t-lab").setAttribute("aria-pressed", showLabels);
}

function frame(reset) {
  const h = mode === "all" && multi ? (CFG.floors.length - 1) * (STOREY + EXPLODE) : 0;
  const tgt = new THREE.Vector3(center.x, h / 2 + 0.3, center.z);
  const fov = THREE.MathUtils.degToRad(cam.fov);
  const fit = Math.max(size / cam.aspect, size * 0.8) / (2 * Math.tan(fov / 2));
  const d = fit * (view === "top" ? 0.95 : 1.15) + h * 0.9;
  if (reset) {
    const dir = view === "top" ? new THREE.Vector3(0.001, 1, 0.12) : (mode === "all" && multi ? new THREE.Vector3(0.6, 0.62, 0.9) : new THREE.Vector3(0.55, 0.95, 0.85));
    cam.position.copy(tgt).addScaledVector(dir.normalize(), d); controls.target.copy(tgt);
  }
  sun.position.set(center.x + 6, 14 + h, center.z + 9); sun.target.position.set(center.x, 0, center.z);
  const s = sun.shadow.camera; s.left = s.bottom = -size; s.right = s.top = size; s.near = 1; s.far = 50 + h; s.updateProjectionMatrix();
  controls.update();
}

async function loadModel(src) {
  if (src.endsWith(".b64.txt")) {
    const t = await fetch(src).then(r => r.text());
    const bin = Uint8Array.from(atob(t.trim()), c => c.charCodeAt(0));
    return new GLTFLoader().parseAsync(bin.buffer, "");
  }
  return new GLTFLoader().loadAsync(src);
}

const box = new THREE.Box3();
for (const f of CFG.floors) {
  const [gltf, lab] = await Promise.all([loadModel(f.model), fetch(f.labels).then(r => r.json())]);
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    const m = o.material;
    if (m.transparent) { o.castShadow = false; m.depthWrite = false; } else o.castShadow = true;
    o.receiveShadow = true; m.side = THREE.DoubleSide;
  });
  const g = new THREE.Group(); g.add(gltf.scene); gltf.scene.position.set(f.dx || 0, 0, f.dz || 0); scene.add(g); groups[f.key] = g;
  labels[f.key] = lab.labels.map(L => {
    const el = document.createElement("div"); el.className = "lab" + (L.minor ? " minor" : ""); el.textContent = L.t;
    const o = new CSS2DObject(el); o.position.set(L.x + (f.dx || 0), 1.45, L.z + (f.dz || 0)); scene.add(o); return o;
  });
  const b = lab.bbox; box.expandByPoint(new THREE.Vector3(b[0] + (f.dx || 0), 0, b[2] + (f.dz || 0))); box.expandByPoint(new THREE.Vector3(b[3] + (f.dx || 0), 0, b[5] + (f.dz || 0)));
}
box.getCenter(center); size = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);
document.getElementById("load").hidden = true;
resize(); apply();
document.getElementById("v-3d").onclick = () => { view = "3d"; apply(); };
document.getElementById("v-top").onclick = () => { view = "top"; apply(); };
document.getElementById("t-lab").onclick = () => { showLabels = !showLabels; apply(); };
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, cam); labelR.render(scene, cam); });
</script>

</body>
</html>
